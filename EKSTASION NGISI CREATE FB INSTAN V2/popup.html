<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-main: #130f1e;
      --bg-card: #1c152e;
      --bg-input: #271e3d;
      --border-color: #3b2c5e;
      --accent-purple: #9d4edd;
      --accent-green: #00e676;
      --text-main: #f3f0f7;
      --text-muted: #a69cb8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-width: 330px;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      padding: 14px;
      margin: 0;
    }

    .header-title {
      margin: 0 0 12px 0;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .header-title span {
      color: var(--accent-green);
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent-purple);
      margin-top: 10px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: rgba(0, 230, 118, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(0, 230, 118, 0.3);
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      resize: vertical;
      font-size: 11px;
      font-family: 'Consolas', 'Courier New', monospace;
      outline: none;
      white-space: pre;
    }

    textarea:focus {
      border-color: var(--accent-purple);
    }

    .txt-phones {
      height: 80px;
    }

    .txt-otps {
      height: 110px;
    }

    .btn-action {
      width: 100%;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      margin-top: 5px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }

    .btn-phone {
      background: #7b2cbf;
      color: #ffffff;
    }

    .btn-phone:hover {
      background: #9d4edd;
    }

    .btn-otp {
      background: var(--accent-green);
      color: #0b2916;
    }

    .btn-otp:hover {
      background: #39ff96;
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
    }

    .btn-nav {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      margin-top: 4px;
      margin-bottom: 6px;
      text-align: left;
      padding-left: 12px;
    }

    .btn-nav:hover {
      background: var(--bg-input);
      border-color: var(--accent-purple);
    }

    .shortcut-tag {
      font-size: 10px;
      opacity: 0.8;
    }

    #status {
      font-size: 11px;
      text-align: center;
      margin-top: 8px;
      color: var(--text-muted);
    }

    .bottom-refresh-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
      gap: 8px;
    }

    .btn-refresh-tab {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-refresh-tab:hover {
      background: var(--bg-input);
      border-color: var(--accent-purple);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(157, 78, 221, 0.25);
    }

    .nav-link-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .btn-nav-link {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-nav-link:hover {
      background: var(--bg-input);
      border-color: var(--accent-purple);
      color: #ffffff;
      box-shadow: 0 0 8px rgba(157, 78, 221, 0.25);
    }

    .btn-nav-link svg {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="header-title">AUTO FILLER <span>BY : ROTI BAKAR RIICH</span></div>

  <div class="section-title">
    1. Antrean Nomor Telepon
    <span class="badge" id="phoneCounter">0 Nomor</span>
  </div>
  <textarea id="phoneInputList" class="txt-phones" placeholder="Tempel nomor telepon di sini (1 nomor per baris)..."></textarea>
  <button class="btn-action btn-phone" id="btnRunPhone">
    ▶ Isi Form Pendaftaran <span class="shortcut-tag"></span>
  </button>

  <div class="section-title">
    2. Format Pesan OTP Bot
    <span class="badge" id="otpCounter">0 Siap</span>
  </div>
  <textarea id="otpRawList" class="txt-otps" placeholder="Tempel seluruh pesan SMS dari bot di sini..."></textarea>
  <button class="btn-action btn-otp" id="btnRunOtp">
    ▶ Isi Kode OTP <span class="shortcut-tag"></span>
  </button>

  <div class="section-title">
    3. Kontrol Navigasi Kode (Semua Tab)
  </div>
  <button class="btn-action btn-nav" id="btnClickIdont">
    ⚡ 1. I Didn't Get the Code
  </button>
  <button class="btn-action btn-nav" id="btnClickResend">
    🔄 2. Resend Code
  </button>
  <button class="btn-action btn-nav" id="btnClickChangeNum">
    ✏️ 3. Change Mobile Number
  </button>

  <div id="status">Siap digunakan.</div>

  <div class="bottom-refresh-area">
    <button class="btn-refresh-tab" id="btnRefreshAll">
      🔁 refresh all tab
    </button>
    <div class="nav-link-group">
      <button class="btn-nav-link" id="btnGoWeb">
        go to web
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#1877F2">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </button>
      <button class="btn-nav-link" id="btnGoM">
        go to m
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#1877F2">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
